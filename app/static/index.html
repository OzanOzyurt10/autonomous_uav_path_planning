<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>IHA Gorev Planlayici</title>
<script src="plotly.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #d8dbe0;
    --ink: #1d2025;
    --muted: #6b7280;
    --accent: #b91c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; flex-wrap: wrap;
    gap: 14px; align-items: flex-end;
  }
  h1 { font-size: 16px; margin: 0 12px 0 0; white-space: nowrap; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label { font-size: 11px; color: var(--muted); }
  .field input { width: 82px; padding: 4px 6px;
                 border: 1px solid var(--line); border-radius: 4px; }
  button {
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--panel); cursor: pointer; font-size: 13px;
  }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  main { display: grid; grid-template-columns: 420px 1fr; gap: 12px;
         padding: 12px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 6px; padding: 10px; }
  .card h2 { font-size: 12px; text-transform: uppercase;
             letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  #map2d { height: 380px; }
  #view3d { height: 620px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; font-size: 11px;
       color: var(--muted); padding: 4px; }
  td { padding: 3px 4px; border-top: 1px solid var(--line); }
  td input { width: 74px; padding: 3px 5px;
             border: 1px solid var(--line); border-radius: 4px; }
  .ghost { color: var(--muted); font-style: italic; }
  #status { margin-top: 10px; font-size: 13px; }
  #status b { font-variant-numeric: tabular-nums; }
  .bad { color: var(--accent); }
  .controls { display: flex; gap: 8px; align-items: center;
              margin-top: 8px; }
  .controls input[type=range] { flex: 1; }
</style>
</head>
<body>

<header>
  <h1>IHA Gorev Planlayici</h1>
  <div class="field"><label>hiz (m/s)</label>
    <input id="speed" type="number" value="28" min="5" max="120" step="1"></div>
  <div class="field"><label>azami yatis (derece)</label>
    <input id="bank" type="number" value="30" min="5" max="60" step="1"></div>
  <div class="field"><label>azami tirmanma (derece)</label>
    <input id="climb" type="number" value="8" min="1" max="45" step="1"></div>
  <div class="field"><label>emniyet payi (m)</label>
    <input id="clearance" type="number" value="100" min="0" max="1000" step="10"></div>
  <div class="field"><label>yineleme</label>
    <input id="iterations" type="number" value="3000" min="200" max="20000" step="500"></div>
  <div class="field"><label>tohum</label>
    <input id="seed" type="number" value="1" min="0" step="1"></div>
  <button id="plan" class="primary">Rotayi planla</button>
  <button id="clear">Waypointleri sil</button>
  <span id="rho" class="ghost"></span>
</header>

<main>
  <div>
    <div class="card">
      <h2>Harita &mdash; tikla, waypoint ekle</h2>
      <div id="map2d"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>Waypointler</h2>
      <table>
        <thead><tr><th>#</th><th>x (m)</th><th>y (m)</th>
          <th>yerden (m)</th><th>irtifa (m)</th><th></th></tr></thead>
        <tbody id="wplist"></tbody>
      </table>
      <p id="empty" class="ghost">Haritaya tiklayarak baslayin.</p>
    </div>
  </div>

  <div class="card">
    <h2>3B gorunum</h2>
    <div id="view3d"></div>
    <div class="controls">
      <button id="play" disabled>Oynat</button>
      <input id="scrub" type="range" min="0" max="0" value="0" disabled>
      <span id="clock" class="ghost">--</span>
    </div>
    <div id="status" class="ghost">Rota henuz planlanmadi.</div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
