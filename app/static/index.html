<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>IHA Gorev Planlayici</title>
<script src="plotly.min.js"></script>
<style>
  :root {
    --bg: #0d1016;
    --surface: #12151b;
    --panel: #171b23;
    --raised: #1d222c;
    --line: #2a3040;
    --ink: #e6e9ef;
    --muted: #8b93a7;
    --faint: #5b6478;
    --route: #ef4d5e;
    --waypoint: #9a6bff;
    --good: #35a87c;
    --warn: #c98a1e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* --- ust serit --------------------------------------------------- */
  header {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 10px 18px; display: flex; flex-wrap: wrap;
    gap: 18px; align-items: flex-end;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-right: 4px; }
  .brand h1 { font-size: 15px; margin: 0; letter-spacing: .01em;
               white-space: nowrap; }
  .brand span { font-size: 11px; color: var(--faint); }
  .group { display: flex; gap: 10px; align-items: flex-end;
           padding-right: 18px; border-right: 1px solid var(--line); }
  .group:last-of-type { border-right: 0; }
  .group > .tag { font-size: 10px; letter-spacing: .09em;
                  text-transform: uppercase; color: var(--faint);
                  writing-mode: vertical-rl; transform: rotate(180deg);
                  padding: 2px 0; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 10px; letter-spacing: .05em;
                 text-transform: uppercase; color: var(--muted); }
  .field input {
    width: 78px; padding: 5px 7px; background: var(--raised);
    border: 1px solid var(--line); border-radius: 5px; color: var(--ink);
    font: inherit; font-variant-numeric: tabular-nums;
  }
  .field input:focus { outline: none; border-color: var(--waypoint); }
  .actions { display: flex; gap: 8px; align-items: center;
             margin-left: auto; }

  button, select {
    padding: 7px 13px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--raised); color: var(--ink); font: inherit;
    font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { border-color: var(--faint); }
  button.primary { background: var(--route); border-color: var(--route);
                   color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .38; cursor: not-allowed; }

  /* --- yerlesim ------------------------------------------------------ */
  main { display: grid; grid-template-columns: minmax(360px, 430px) 1fr;
         gap: 14px; padding: 14px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 8px; padding: 12px 13px; }
  .card + .card { margin-top: 14px; }
  .card h2 { font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
             color: var(--muted); margin: 0 0 10px;
             display: flex; justify-content: space-between; gap: 10px; }
  .card h2 em { font-style: normal; color: var(--faint);
                text-transform: none; letter-spacing: 0; font-size: 11px; }
  #map2d { height: 400px; }
  #view3d { height: 560px; }

  /* --- waypoint tablosu ---------------------------------------------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; font-size: 10px;
       letter-spacing: .05em; text-transform: uppercase;
       color: var(--faint); padding: 0 5px 6px; }
  td { padding: 5px; border-top: 1px solid var(--line);
       font-variant-numeric: tabular-nums; }
  td:first-child { color: var(--waypoint); font-weight: 600; width: 26px; }
  td input { width: 70px; padding: 3px 6px; background: var(--raised);
             border: 1px solid var(--line); border-radius: 4px;
             color: var(--ink); font: inherit;
             font-variant-numeric: tabular-nums; }
  td button { padding: 1px 8px; font-size: 15px; line-height: 1.2;
              color: var(--muted); background: none; border: 0; }
  td button:hover { color: var(--route); }
  tr.leg-bad td { background: rgba(239, 77, 94, .10); }
  tr.leg-bad td:first-child { box-shadow: inset 2px 0 0 var(--route); }
  .ghost { color: var(--faint); font-style: normal; }

  /* --- oynatma serit -------------------------------------------------- */
  .controls { display: flex; gap: 10px; align-items: center;
              margin-top: 10px; padding-top: 10px;
              border-top: 1px solid var(--line); }
  .controls input[type=range] { flex: 1; accent-color: var(--route); }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px;
           color: var(--muted); min-width: 178px; text-align: right; }

  /* --- durum kutulari -------------------------------------------------- */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr);
           gap: 10px; margin-top: 12px; }
  .tile { background: var(--raised); border: 1px solid var(--line);
          border-radius: 7px; padding: 9px 11px; }
  .tile .k { font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
             color: var(--faint); }
  .tile .v { font-size: 21px; font-weight: 600; line-height: 1.25;
             font-variant-numeric: tabular-nums; }
  .tile .u { font-size: 11px; color: var(--muted); margin-left: 3px;
             font-weight: 400; }
  .tile.good .v { color: var(--good); }
  .tile.warn .v { color: var(--warn); }
  .tile.bad  .v { color: var(--route); }
  #status { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  #status.bad { color: var(--route); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>IHA Gorev Planlayici</h1>
    <span>Dubins RRT* &middot; arazi takipli</span>
  </div>

  <div class="group">
    <span class="tag">ucak</span>
    <div class="field"><label>hiz m/s</label>
      <input id="speed" type="number" value="28" min="5" max="120" step="1"></div>
    <div class="field"><label>yatis&deg;</label>
      <input id="bank" type="number" value="30" min="5" max="60" step="1"></div>
    <div class="field"><label>tirmanma&deg;</label>
      <input id="climb" type="number" value="8" min="1" max="45" step="1"></div>
  </div>

  <div class="group">
    <span class="tag">gorev</span>
    <div class="field"><label>emniyet m</label>
      <input id="clearance" type="number" value="100" min="0" max="1000" step="10"></div>
    <div class="field"><label>yineleme</label>
      <input id="iterations" type="number" value="3000" min="200" max="20000" step="500"></div>
    <div class="field"><label>tohum</label>
      <input id="seed" type="number" value="1" min="0" step="1"></div>
  </div>

  <div class="actions">
    <span id="rho" class="ghost"></span>
    <button id="clear">Temizle</button>
    <button id="plan" class="primary" disabled>Rotayi planla</button>
  </div>
</header>

<main>
  <div>
    <div class="card">
      <h2>Harita <em id="extent"></em></h2>
      <div id="map2d"></div>
    </div>

    <div class="card">
      <h2>Waypointler <em>tikla ekle &middot; surukle tasi</em></h2>
      <table>
        <thead><tr><th>#</th><th>x</th><th>y</th>
          <th>yerden</th><th>irtifa</th><th></th></tr></thead>
        <tbody id="wplist"></tbody>
      </table>
      <p id="empty" class="ghost">Haritaya tiklayarak baslayin.</p>
    </div>
  </div>

  <div class="card">
    <h2>3B gorunum <em>surukle dondur &middot; tekerlek yakinlastir</em></h2>
    <div id="view3d"></div>

    <div class="controls">
      <button id="play" disabled>Oynat</button>
      <select id="rate" title="oynatma hizi">
        <option value="1">1&times;</option>
        <option value="5" selected>5&times;</option>
        <option value="20">20&times;</option>
        <option value="60">60&times;</option>
      </select>
      <input id="scrub" type="range" min="0" max="0" value="0" disabled>
      <span id="clock">--</span>
    </div>

    <div class="tiles">
      <div class="tile"><div class="k">uzunluk</div>
        <div class="v" id="statLength">&ndash;<span class="u">km</span></div></div>
      <div class="tile"><div class="k">ucus suresi</div>
        <div class="v" id="statTime">&ndash;</div></div>
      <div class="tile" id="tileAgl"><div class="k">en dusuk AGL</div>
        <div class="v" id="statAgl">&ndash;<span class="u">m</span></div></div>
      <div class="tile"><div class="k">bacak</div>
        <div class="v" id="statLegs">&ndash;</div></div>
    </div>

    <div id="status">Rota henuz planlanmadi.</div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
