<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Karo saglayici sinamasi</title>
<style>
  body { margin: 0; background: #0d1016; color: #e6e9ef;
         font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid #2a3040; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0; color: #8b93a7; font-size: 13px; }
  #ozet { padding: 12px 18px; font-family: ui-monospace, Consolas, monospace;
          font-size: 13px; background: #12151b;
          border-bottom: 1px solid #2a3040; white-space: pre-wrap; }
  .grid { display: grid; gap: 14px; padding: 18px;
          grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); }
  .kart { background: #171b23; border: 1px solid #2a3040; border-radius: 8px;
          overflow: hidden; }
  .kart img { display: block; width: 100%; height: 256px;
              object-fit: cover; background: #0f1622; }
  .kart .ad { padding: 7px 10px 2px; font-size: 13px; font-weight: 600; }
  .kart .tur { padding: 0 10px; font-size: 11px; color: #5b6478; }
  .kart .durum { padding: 4px 10px 9px; font-size: 12px; }
  .ok { color: #35a87c; } .bad { color: #ef4d5e; } .dim { color: #8b93a7; }
  .kart.ok { border-color: #35a87c; }
  .kart.bad { opacity: .55; }
</style>
</head>
<body>

<header>
  <h1>Hangi harita saglayicisi senin agindan geciyor?</h1>
  <p>Her kutu tek bir karo indiriyor: Slovenya, zoom 10. Goruntu gelirse
     o saglayici calisiyor demektir.</p>
</header>

<div id="ozet">deneniyor...</div>
<div class="grid" id="grid"></div>

<script>
"use strict";

// Slovenya, zoom 10. OSM duzeninde x=552 y=363; Esri/WMTS duzeninde
// satir/sutun sirasi ters oldugu icin adres kaliplari farkli yaziliyor.
const Z = 10, X = 552, Y = 363;

const KAYNAKLAR = [
  { ad: "OpenStreetMap", tur: "sokak haritasi - Google Maps gorunumu",
    url: "https://tile.openstreetmap.org/" + Z + "/" + X + "/" + Y + ".png" },

  { ad: "Sentinel-2 cloudless (EOX)", tur: "UYDU - bulutsuz, tum dunya",
    url: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/" +
         "default/g/" + Z + "/" + Y + "/" + X + ".jpg" },

  { ad: "Esri World Imagery", tur: "UYDU - onceki denemede reddetti",
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/" +
         "World_Imagery/MapServer/tile/" + Z + "/" + Y + "/" + X },

  { ad: "Esri (services. alt sunucu)", tur: "UYDU - ayni servis, baska host",
    url: "https://services.arcgisonline.com/ArcGIS/rest/services/" +
         "World_Imagery/MapServer/tile/" + Z + "/" + Y + "/" + X },

  { ad: "Carto Dark Matter", tur: "sokak haritasi - koyu tema",
    url: "https://basemaps.cartocdn.com/dark_all/" + Z + "/" + X + "/" +
         Y + ".png" },

  { ad: "OpenTopoMap", tur: "topografik - kot egrileri, IHA icin iyi",
    url: "https://tile.opentopomap.org/" + Z + "/" + X + "/" + Y + ".png" },

  { ad: "Wikimedia Maps", tur: "sokak haritasi",
    url: "https://maps.wikimedia.org/osm-intl/" + Z + "/" + X + "/" +
         Y + ".png" },

  { ad: "NASA GIBS (Blue Marble)", tur: "UYDU - dusuk zoom siniri",
    url: "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/" +
         "BlueMarble_ShadedRelief_Bathymetry/default/500m/" +
         Z + "/" + Y + "/" + X + ".jpeg" }
];

const grid = document.getElementById("grid");
const ozet = document.getElementById("ozet");
let biten = 0;
const calisan = [];

KAYNAKLAR.forEach(function (kaynak) {
  const kart = document.createElement("div");
  kart.className = "kart";
  kart.innerHTML =
    '<img alt="">' +
    '<div class="ad"></div>' +
    '<div class="tur"></div>' +
    '<div class="durum dim">yukleniyor...</div>';
  kart.querySelector(".ad").textContent = kaynak.ad;
  kart.querySelector(".tur").textContent = kaynak.tur;
  grid.appendChild(kart);

  const img = kart.querySelector("img");
  const durum = kart.querySelector(".durum");
  const basladi = performance.now();

  img.onload = function () {
    const ms = Math.round(performance.now() - basladi);
    kart.classList.add("ok");
    durum.className = "durum ok";
    durum.textContent = "CALISIYOR - " + img.naturalWidth + "x" +
                        img.naturalHeight + " px, " + ms + " ms";
    calisan.push(kaynak.ad);
    bitir();
  };
  img.onerror = function () {
    kart.classList.add("bad");
    durum.className = "durum bad";
    durum.textContent = "ULASILAMADI";
    bitir();
  };
  img.src = kaynak.url;
});

function bitir() {
  biten += 1;
  if (biten < KAYNAKLAR.length) {
    ozet.textContent = biten + " / " + KAYNAKLAR.length + " denendi...";
    return;
  }
  if (!calisan.length) {
    ozet.className = "bad";
    ozet.textContent =
      "Hicbiri gelmedi. Bu, tek tek saglayicilarin degil aginin disari " +
      "kapali oldugunu gosterir - guvenlik duvari, VPN ya da DNS. " +
      "Bu durumda cevrimdisi vektor haritayla devam ederiz.";
    return;
  }
  ozet.className = "ok";
  ozet.textContent = "CALISAN SAGLAYICILAR (" + calisan.length + "):\n  " +
                     calisan.join("\n  ") +
                     "\n\nBunlari bana yaz, haritayi buna gore kurayim.";
}
</script>
</body>
</html>
